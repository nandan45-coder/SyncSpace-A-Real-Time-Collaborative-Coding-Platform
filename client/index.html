<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SyncSpace — Real-time collaborative whiteboard and code editor. Work together, create together." />
    <meta name="theme-color" content="#080A0F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>SyncSpace — Collaborate in Real-Time</title>
    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('syncspace-ui') || '{}');
        var t = s && s.state && s.state.theme;
        if (t === 'light' || t === 'dark') document.documentElement.className = t;
      } catch (e) {}
    </script>
    <!-- Polyfills for simple-peer in Vite -->
    <script>
      window.global = window;
      window.process = { env: {} };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
